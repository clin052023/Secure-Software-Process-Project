element26:
  name: Profile Applicability
  requirements:
  - Use Docker's in-built secret management commands for control of secrets.
  - Review whether to run Docker swarm manager in auto-lock mode.
  - Ensure that the Docker daemon is used in a non-root user.
element27:
  name: Container Image Configuration
  requirements:
  - Use trusted base images.
  - Scan and rebuild images to include security patches.
  - Restrict the use of privileged containers.
element28:
  name: Docker Swarm Configuration
  requirements:
  - Use a separate partition for containers.
  - Ensure that the Docker daemon is used in a non-root user.
  - Configure the swarm manager to run in auto-lock mode.
element29:
  name: Network Security
  requirements:
  - Restrict network traffic between containers.
  - Use a non-root user for running the Docker daemon.
  - Use a non-root user for running the Docker swarm manager.
element30:
  name: Security Operations
  requirements:
  - Ensure that image sprawl is avoided.
  - Scan and rebuild images to include security patches.
  - Ensure that the Docker daemon is used in a non-root user.
