element1:
  name: Containerization Security
  requirements:
  - Ensure a separate partition for containers has been created
  - Ensure only trusted users are allowed to control Docker daemon
  - Ensure auditing is configured for the Docker daemon
  - Ensure auditing is configured for Docker files and directories - /var/lib/docker
  - Ensure auditing is configured for Docker files and directories - /etc/docker
  - Ensure auditing is configured for Docker files and directories - docker.service
  - Ensure auditing is configured for Docker files and directories - containerd.sock
element2:
  name: User Access Control
  requirements:
  - You should remove any untrusted users from the docker group.
  - Additionally, you should not create a mapping of sensitive directories from the
    host to container volumes.
element3:
  name: Container Host Security
  requirements:
  - A container host is able to run one or more containers.
  - You may consider various CIS Security Benchmarks for your container host.
  - If you have other security guidelines or regulatory requirements to adhere to,
    please follow them as suitable in your environment.
element4:
  name: Docker Version
  requirements:
  - Frequent releases for Docker are issued which address security vulnerabilities,
    resolve product bugs and bring in new functionality.
  - You should monitor versions of Docker releases and make sure your software is
    updated as required.
element5:
  name: Docker Daemon Non-Root
  requirements:
  - Rootless mode executes the Docker daemon and containers inside a user namespace,
    with both the daemon and the container are running without root privileges.
  - Follow the current Docker documentation on how to install the Docker daemon as
    a non-root user.
element6:
  name: Network Traffic Restriction
  requirements:
  - By default, all network traffic is allowed between containers on the same host
    on the default network bridge.
  - If not desired, restrict all inter-container communication.
  - Link specific containers together that require communication.
  - Alternatively, you can create custom network and only join containers that need
    to communicate to that custom network.
  - The --icc parameter only applies to the default docker bridge, if custom networks
    are used then the approach of segmenting networks should be adopted instead.
element7:
  name: Logging Level
  requirements:
  - Set Docker daemon log level to info.
  - 'Alternatively, run the Docker daemon as below: dockerd --log-level="info"'
element8:
  name: iptables
  requirements:
  - Do not run the Docker daemon with --iptables=false parameter.
  - 'For example, do not start the Docker daemon as below: dockerd --iptables=false'
element9:
  name: ASोस Storage Driver
  requirements:
  - Do not use aufs as the storage driver for your Docker instance.
  - For example, do not explicitly use aufs as storage driver.
  - 'For example, do not start Docker daemon as below: dockerd --storage-driver aufs'
element10:
  name: Devicemapper Storage Driver
  requirements:
  - Do not use devicemapper as the storage driver for your Docker instance.
  - For example, do not explicitly use devicemapper as storage driver.
  - 'For example, do not start Docker daemon as below: dockerd --storage-driver devicemapper'
element11:
  name: Security Registries
  requirements:
  - Ensure that no insecure registries are in use.
element12:
  name: Docker Version Management
  requirements:
  - Frequent releases for Docker are issued which address security vulnerabilities,
    resolve product bugs and bring in new functionality. You should keep a tab on
    these product updates and upgrade as frequently as possible in line with the general
    IT security policy of your organization.
element13:
  name: Server Version Information
  requirements:
  - Hide server version information by setting server_tokens to off in the web server
    configuration.
element14:
  name: Ulimit Configuration
  requirements:
  - Run Docker in daemon mode and pass --default-ulimit as argument with respective
    ulimits as appropriate in your environment and in line with your security policy.
element15:
  name: User Namespace Support
  requirements:
  - Please consult the Docker documentation for various ways in which this can be
    configured depending upon your requirements.
element16:
  name: Cgroup Usage Confirmation
  requirements:
  - The --cgroup-parent option allows you to set the default cgroup parent to use
    for all containers. If there is no specific usage requirement for this, the setting
    should be left at its default.
element17:
  name: Base Device Size
  requirements:
  - Do not set --storage-opt dm.basesize until needed.
element18:
  name: Centralized Logging
  requirements:
  - 'Step 1: Set up the desired log driver following its documentation. Step 2: Start
    the docker daemon using that logging driver.'
element19:
  name: Container Privilege Restriction
  requirements:
  - 'You should run the Docker daemon as below: dockerd --no-new-privileges'
element20:
  name: Live Restore
  requirements:
  - Docker does not stop containers on shutdown or restore when using --live-restore.
  - Run Docker in daemon mode and pass --live-restore to it as an argument.
  - Enable full support of daemon-less containers within Docker
  - Ensure that Docker does not stop containers on shutdown or restore
element21:
  name: Userland Proxy
  requirements:
  - The Docker daemon starts a userland proxy service for port forwarding whenever
    a port is exposed.
  - Where hairpin NAT is available, this service is generally superfluous to requirements
    and can be disabled.
  - Disable the Docker daemon's userland proxy service
element22:
  name: Seccomp Profile
  requirements:
  - You can choose to apply a custom seccomp profile at a daemon-wide level if needed
    with this overriding Docker's default seccomp profile.
  - By default, Docker's default seccomp profile is applied.
  - If you choose to apply your own seccomp profile, use the --seccomp-profile flag
    at daemon start or put it in the daemon runtime parameters file.
  - Apply a custom seccomp profile if appropriate
  - Use the --seccomp-profile flag at daemon start or put it in the daemon runtime
    parameters file
  - By default, seccomp profiles are enabled.
  - You do not need to do anything unless you want to modify and use a modified seccomp
    profile.
element23:
  name: Docker Service Ownership
  requirements:
  - You should verify that the docker.service file ownership and group ownership are
    correctly set to root.
  - 'Step 1: Find out the file location: systemctl show -p FragmentPath docker.service
    Step 2: If the file does not exist, this recommendation is not applicable.'
  - If the file exists, you should execute the command below, including the correct
    file path, in order to set the ownership and group ownership for the file to root.
  - 'Step 2: If the file does not exist, this recommendation is not applicable.'
  - If the file exists, execute the command below including the correct file path
    to set the file permissions to 644.
  - 'Step 2: If the file exists, you should execute the command below, including the
    correct file path to set the file permissions to 644.'
  - Verify that the docker.service file ownership and group ownership are correctly
    set to root
  - Execute the command below, including the correct file path, in order to set the
    ownership and group ownership for the file to root
element24:
  name: Docker Socket Ownership
  requirements:
  - You should verify that the docker.socket file ownership and group ownership are
    correctly set to root.
  - 'Step 1: Find out the file location: systemctl show -p FragmentPath docker.socket
    Step 2: If the file does not exist, this recommendation is not applicable.'
  - If the file exists, execute the command below, including the correct file path
    to set the ownership and group ownership for the file to root.
  - Verify that the docker.socket file ownership and group ownership are correctly
    set to root
  - Execute the command below, including the correct file path to set the ownership
    and group ownership for the file to root
element25:
  name: Docker Socket Permissions
  requirements:
  - You should verify that the file permissions on the docker.socket file are correctly
    set to 644 or more restrictively.
  - If the file does exist, you should execute the command below, including the correct
    file path to set the file permissions to 644.
element26:
  name: /etc/docker
  requirements:
  - 'To resolve this issue you should run the following command: chown root:root /etc/docker'
  - This sets the ownership and group ownership for the directory to root.
  - Set ownership of /etc/docker to root:root
  - Restrict permissions on /etc/docker to 755 or more restrictively
element27:
  name: /etc/docker/certs.d
  requirements:
  - 'The following command could be executed: find /etc/docker/certs.d/ -type f -exec
    chmod 0444 {} \; This would set the permissions for the registry certificate files
    to 444.'
  - 'You should execute the following command: chown root:root /etc/docker/certs.d//*
    This would set the individual ownership and group ownership for the registry certificate
    files to root.'
  - 'You should execute the following command: find /etc/docker/certs.d/ -type f -exec
    chmod 0444 {} \; This would set the permissions for the registry certificate files
    to 444.'
  - Ensure all registry certificate files are individually owned and group owned by
    root
  - Set permissions on /etc/docker/certs.d to 444 or more restrictively
element28:
  name: TLS CA Certificate
  requirements:
  - Verify that the TLS CA certificate file is individually owned and group owned
    by root
  - Set permissions on the TLS CA certificate file to 444 or more restrictively
element29:
  name: Docker Server Certificate
  requirements:
  - Verify that the Docker server certificate file is individually owned and group
    owned by root
  - Set permissions on the Docker server certificate file to 444 or more restrictively
element30:
  name: Docker server certificate key file
  requirements:
  - You should verify that the Docker server certificate key file (the file that is
    passed along with the --tlskey parameter) is individually owned and group owned
    by root.
element31:
  name: Docker server certificate key file permissions
  requirements:
  - You should verify that the Docker server certificate key file (the file that is
    passed along with the --tlskey parameter) has permissions of 400.
element32:
  name: Docker socket file ownership
  requirements:
  - You should verify that the Docker socket file is owned by root and group owned
    by docker.
  - 'You should execute the following command: chown root:docker /var/run/docker.sock
    This sets the ownership to root and group ownership to docker for the default
    Docker socket file.'
element33:
  name: Docker socket file permissions
  requirements:
  - You should verify that the Docker socket file has permissions of 660 or are configured
    more restrictively.
  - You should execute the command below. chmod 660 /var/run/docker.sock This sets
    the file permissions of the Docker socket file to 660.
  - 'You should execute the following command: chown root:docker'
element34:
  name: Daemon.json file ownership
  requirements:
  - You should verify that the daemon.json file individual ownership and group ownership
    is correctly set to root.
  - 'You should execute the following command: chown root:root /etc/docker/daemon.json
    This sets the ownership and group ownership of the file to root.'
element35:
  name: daemon.json file permissions
  requirements:
  - You should verify that if the daemon.json file is present, its file permissions
    are correctly set to 644 or more restrictively.
  - You should execute the command below. chmod 644 /etc/docker/daemon.json This sets
    the file permissions for this file to 644.
element36:
  name: /etc/default/docker file ownership
  requirements:
  - You should verify that the /etc/default/docker file ownership and group-ownership
    is correctly set to root.
  - 'You should execute the following command: chown root:root /etc/default/docker
    This sets the ownership and group ownership of the file to root.'
element37:
  name: /etc/default/docker file permissions
  requirements:
  - You should verify that the /etc/default/docker file permissions are correctly
    set to 644 or more restrictively.
  - 'You should execute the following command: chmod 644 /etc/default/docker This
    sets the file permissions for this file to 644.'
element38:
  name: /etc/sysconfig/docker file permissions
  requirements:
  - You should verify that the /etc/sysconfig/docker file permissions are correctly
    set to 644 or more restrictively.
  - 'You should execute the following command: chmod 644 /etc/sysconfig/docker This
    sets the file permissions for this file to 644.'
element39:
  name: /etc/sysconfig/docker file ownership
  requirements:
  - You should verify that the /etc/sysconfig/docker file individual ownership and
    group ownership is correctly set to root.
  - 'You should execute the following command: chown root:root /etc/sysconfig/docker
    This sets the ownership and group ownership for the file to root.'
element40:
  name: Containerd socket file
  requirements:
  - You should verify that the Containerd socket file is owned by root and group owned
    by root.
  - 'You should execute the following command: chown root:root /run/containerd/containerd.sock
    This sets the ownership to root and group ownership to root for the default Containerd
    socket file.'
  - Set ownership of the Containerd socket file to root and group owned by root
  - Execute the command chown root:root /run/containerd/containerd.sock
element41:
  name: Containerd socket file permissions
  requirements:
  - You should verify that the Containerd socket file has permissions of 660 or are
    configured more restrictively.
  - You should execute the command below. chmod 660 /run/containerd/containerd.sock
    This sets the file permissions of the Containerd socket file to 660.
  - Set the permissions of the Containerd socket file to 660 or more restrictively
  - Execute the command chmod 660 /run/containerd/containerd.sock
element42:
  name: User for the container
  requirements:
  - You should ensure that containers should run as a non-root user.
element43:
  name: Images are scanned and rebuilt
  requirements:
  - Images should be scanned frequently for any vulnerabilities.
  - You should rebuild all images to include these patches and then instantiate new
    containers from them.
  - Images should be re-built ensuring that the latest version of the base images
    are used, to keep the operating system patch level at an appropriate level.
element44:
  name: Content trust
  requirements:
  - Content trust is disabled by default and should be enabled in line with organizational
    security policy.
  - 'To enable content trust in a bash shell, you should enter the following command:
    export DOCKER_CONTENT_TRUST=1 Alternatively, you could set this environment variable
    in your profile file so that content trust in enabled on every login.'
element45:
  name: HEALTHCHECK
  requirements:
  - You should add the HEALTHCHECK instruction to your Docker container images in
    order to ensure that health checks are executed against running containers.
  - You should follow the Docker documentation and rebuild your container images to
    include the HEALTHCHECK instruction.
element46:
  name: Update Instructions
  requirements:
  - You should not use OS package manager update instructions such as apt-get update
    or yum update either alone or in a single line in any Dockerfiles used to generate
    images under review.
  - You should use update instructions together with install instructions and version
    pinning for packages while installing them. This will prevent caching and force
    the extraction of the required versions.
element47:
  name: Secrets Management
  requirements:
  - Do not store any secrets in Dockerfiles. Where secrets are required during the
    build process, make use of a secrets management tool, such as the buildkit builder
    included with Docker.
  - You should use Docker's in-built secret management command for managing secrets
    in a swarm cluster.
  - You should follow the docker secret documentation and use it to manage secrets
    effectively.
element48:
  name: Package Verification
  requirements:
  - Validate artifacts signatures before uploading to the package registry.
element49:
  name: Swarm Mode
  requirements:
  - Do not enable swarm mode on a Docker engine instance unless this is needed.
element50:
  name: AppArmor
  requirements:
  - If AppArmor is applicable for your Linux OS, you should enable it.
element51:
  name: SELinux
  requirements:
  - If SELinux is applicable for your Linux OS, you should use it.
element52:
  name: Configuration File
  requirements:
  - Ensure only modern TLS versions are enabled by setting ssl_protocols to TLSv1.2
    TLSv1.3 in the web server configuration.
element53:
  name: Network
  requirements:
  - Ensure only verified packages are installed
element54:
  name: Build System
  requirements:
  - Use the COPY instruction instead of ADD instruction in Dockerfiles.
element55:
  name: Buildkit
  requirements:
  - Use the buildkit builder included with Docker to ensure the correct package versions
    are used during the build process.
element56:
  name: Network Namespace
  requirements:
  - Ensure that the host's network namespace is not shared
  - You should not pass the --net=host option when starting any container.
  - When the networking mode on a container is set to --net=host, the container is
    not placed inside a separate network stack. Effectively, applying this option
    instructs Docker to not containerize the container's networking.
element57:
  name: Memory Management
  requirements:
  - You should run the container with only as much memory as it requires by using
    the -- memory argument.
  - 'For example, you could run a container using the command below: docker run -d
    --memory 256m centos sleep 1000 In the example above, the container is started
    with a memory limit of 256 MB.'
element58:
  name: CPU Priority
  requirements:
  - You should manage the CPU runtime between your containers dependent on their priority
    within your organization.
  - To do so start the container using the --cpu-shares argument.
  - By default, all containers on a Docker host share resources equally. By using
    the resource management capabilities of the Docker host you can control the host
    CPU resources that a container may consume.
element59:
  name: Root Filesystem Mount
  requirements:
  - The container's root filesystem should be treated as a 'golden image' by using
    Docker run's --read-only option.
  - You should add a --read-only flag at a container's runtime to enforce the container's
    root filesystem being mounted as read only.
element60:
  name: Container Traffic Binding
  requirements:
  - By default, Docker containers can make connections to the outside world, but the
    outside world cannot connect to containers and each outgoing connection will appear
    to originate from one of the host machine's own IP addresses.
  - You should bind the container port to a specific host interface on the desired
    host port.
element61:
  name: Memory Usage
  requirements:
  - By default, all containers on a Docker host share resources equally. By using
    the resource management capabilities of the Docker host, you can control the amount
    of memory that a container is able to use.
element62:
  name: Container Root Filesystem
  requirements:
  - The container's root filesystem should be treated as a 'golden image' by using
    Docker run's --read-only option. This prevents any writes to the container's root
    filesystem at container runtime and enforces the principle of immutable infrastructure.
element63:
  name: Host Interface Binding
  requirements:
  - By default, Docker containers can make connections to the outside world, but the
    outside world cannot connect to containers and each outgoing connection will appear
    to originate from one of the host machine's own IP addresses. You should only
    allow container services to be contacted through a specific external interface
    on the host machine.
element64:
  name: on-failure
  requirements:
  - By using the --restart flag in the docker run command you can specify a restart
    policy for how a container should or should not be restarted on exit. You should
    choose the on-failure restart policy and limit the restart attempts to 5.
  - 'If you wish a container to be automatically restarted, a sample command is as
    below: docker run --detach --restart=on-failure:5 nginx'
element65:
  name: Process Namespace
  requirements:
  - The Process ID (PID) namespace isolates the process ID space, meaning that processes
    in different PID namespaces can have the same PID. This creates process level
    isolation between the containers and the host.
  - 'You should not start a container with the --pid=host argument. For example, do
    not start a container with the command below: docker run --interactive --tty --pid=host
    centos /bin/bash'
element66:
  name: Host Device Exposure
  requirements:
  - Host devices can be directly exposed to containers at runtime. Do not directly
    expose host devices to containers, especially to containers that are not trusted.
  - 'You should not directly expose host devices to containers. If you do need to
    expose host devices to containers, you should use granular permissions as appropriate
    to your organization: For example, do not start a container using the command
    below: docker run --interactive --tty --device=/dev/tty0:/dev/tty0:rwm -- device=/dev/temp_sda:/dev/temp_sda:rwm
    centos bash You should only share the host device using appropriate permissions:
    docker run --interactive --tty --device=/dev/tty0:/dev/tty0:rw -- device=/dev/temp_sda:/dev/temp_sda:r
    centos bash'
element67:
  name: Ulimit Overwrite
  requirements:
  - The default ulimit is set at the Docker daemon level. However, if you need to,
    you may override the default ulimit setting during container runtime.
  - 'You should only override the default ulimit settings if needed in a specific
    case. For example, to override default ulimit settings start a container as below:
    docker run -ti -d --ulimit nofile=1024:1024 centos sleep 1000'
element68:
  name: Mount Propagation Mode
  requirements:
  - Mount propagation mode allows mounting volumes in shared, slave or private mode
    on a container.
  - Do not use shared mount propagation mode unless explicitly needed.
element69:
  name: UTS Namespace
  requirements:
  - 'The UTS namespace provides isolation between two system identifiers: the hostname
    and the NIS domain name. It is used to set the hostname and the domain which are
    visible to running processes in that namespace. Processes running within containers
    do not typically require to know either the hostname or the domain name. The UTS
    namespace should therefore not be shared with the host.'
  - 'You should not start a container with the --uts=host argument. For example, do
    not start a container using the command below: docker run --rm --interactive --tty
    --uts=host rhel7.2'
element70:
  name: Information Disclosure
  requirements:
  - You should not directly expose host devices to containers, especially to containers
    that are not trusted.
element71:
  name: docker exec commands
  requirements:
  - You should not use the --privileged option in docker exec commands.
  - You should not use the --user=root option in docker exec commands.
element72:
  name: cgroup usage
  requirements:
  - You should not use the --cgroup-parent option within the docker run command unless
    strictly required.
element73:
  name: container health checks
  requirements:
  - If the container image does not have an HEALTHCHECK instruction defined, you should
    use the --health-cmd parameter at container runtime to check container health.
element74:
  name: PIDs cgroup limit
  requirements:
  - You should use the --pids-limit flag at container runtime.
element75:
  name: Docker bridge
  requirements:
  - You should not use Docker's default bridge docker0. Instead you should use Docker's
    user-defined networks for container networking.
element76:
  name: host user namespaces
  requirements:
  - You should not share the host's user namespaces with containers running on it.
element77:
  name: image versioning
  requirements:
  - You should always ensure that you are using the latest version of the images within
    your repository and not cached older versions.
element78:
  name: Docker Socket
  requirements:
  - Ensure that the Docker socket docker.sock should not be mounted inside any containers.
  - You should ensure that no containers mount docker.sock as a volume.
element79:
  name: Image Sprawl
  requirements:
  - Ensure that image sprawl is avoided.
  - You should keep only the images that you actually need and establish a workflow
    to remove old or stale images from the host.
  - Additionally, you should use features such as pull-by-digest to get specific images
    from the registry.
element80:
  name: Container Sprawl
  requirements:
  - 'You should periodically check your container inventory on each host and clean
    up containers which are not in active use with the command below: docker container
    prune'
element81:
  name: Manager Node Creation
  requirements:
  - Ensure that the minimum number of required manager nodes is created in a swarm.
element82:
  name: Swarm Service Binding
  requirements:
  - By default, Docker swarm services will listen on all interfaces on the host. This
    may not be necessary for the operation of the swarm where the host has multiple
    network interfaces.
  - Resolving this issues requires re-initialization of the swarm, specifying a specific
    interface for the --listen-addr parameter.
element83:
  name: Docker Overlay Network Encryption
  requirements:
  - Ensure that all Docker swarm overlay networks are encrypted.
  - You should create overlay networks with the --opt encrypted flag.
element84:
  name: Swarm Manager Auto-Lock
  requirements:
  - Review whether you wish to run Docker swarm manager in auto-lock mode.
  - 'If you are initializing a swarm, use the command below: docker swarm init --autolock'
element85:
  name: Swarm Manager Auto-Lock Key Rotation
  requirements:
  - You should rotate the swarm manager auto-lock key periodically.
  - You should run the command below to rotate the keys. docker swarm unlock-key --rotate
element86:
  name: Node Certificate Rotation
  requirements:
  - You should rotate swarm node certificates in line with your organizational security
    policy.
  - You should run the command to set the desired expiry time on the node certificate.
element87:
  name: CA Certificate Rotation
  requirements:
  - You should rotate root CA certificates as appropriate.
  - You should run the command to rotate a certificate.
element88:
  name: Configuration Area
  requirements:
  - Ensure that the minimum number of manager nodes have been created in a swarm.
element89:
  name: Swarm Initialization
  requirements:
  - Initialize the swarm with dedicated interfaces for management and data planes
    respectively.
  - Configure the swarm with dedicated interfaces for management and data planes respectively.
